# IDMC connection settings for the export_*.py scripts (see README.md)
# Values are used as-is (no quotes, no escaping).

# IDMC base URL (pod login URL)
baseUrl=https://dm-em.informaticacloud.com

# IICS v3 REST API base URL (baseApiUrl returned by the v3 login); empty = https://emw1.dm-em.informaticacloud.com/saas
iics.baseApiUrl.v3=https://emw1.dm-em.informaticacloud.com/saas

# HTTP(S) proxy for all API calls, e.g. http://proxy.example.com:8080 or http://user:password@proxy:8080
# empty = use the HTTPS_PROXY / HTTP_PROXY / NO_PROXY environment variables, if any
proxy=

# CA certificate file (PEM) used to verify the TLS certificates of the API hosts, e.g. when a proxy
# inspects TLS with a corporate CA. RHEL: /etc/pki/tls/certs/ca-bundle.crt (system trust store)
# empty = REQUESTS_CA_BUNDLE environment variable, else the CAs bundled with Python requests
caBundle=

# Folder the downloaded export file is copied to (created if missing).
# Relative paths are resolved from the current folder; empty = ./export
exportFolder=

# Folder for the per-execution log files (created if missing).
# Relative paths are resolved from the current folder; empty = ./logs
logFolder=

# If username and password are set, the script logs in and writes a fresh JWT to "jwt" below.
username=
password=

# Used for authentication when username/password are empty.
jwt=
